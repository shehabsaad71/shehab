<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="شهاب سعد — مطور برمجيات، طالب علوم حاسب، مطور ألعاب، مصمم واجهات ومصمم ثلاثي الأبعاد.">

    <meta
        name="theme-color"
        content="#0ea5e9">

    <title data-i18n="doc_title">
        شهاب سعد — مطور برمجيات
    </title>
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- =====================================================
         MODEL VIEWER
         ===================================================== -->

    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js">
    </script>

    <!-- =====================================================
         CSS
         ===================================================== -->

    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            color: #0f172a;
            background: #f8fbff;

            transition:
                background .35s ease,
                color .35s ease;
        }

        body.dark {
            color: #e5faff;
            background: #030609;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* =====================================================
           VARIABLES
           ===================================================== */

        :root {

            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #38bdf8;

            --text: #0f172a;
            --muted: #64748b;

            --background: #f8fbff;
            --surface: rgba(255,255,255,.78);
            --surface-solid: #ffffff;

            --border: rgba(14,165,233,.16);

            --shadow:
                0 20px 60px rgba(15,23,42,.08);

            --grid:
                rgba(14,165,233,.075);

            --nav:
                rgba(248,251,255,.78);

            --radius: 24px;
        }

        body.dark {

            --primary: #22d3ee;
            --primary-dark: #06b6d4;
            --primary-light: #67e8f9;

            --text: #e5faff;
            --muted: #91a8b3;

            --background: #030609;
            --surface: rgba(8,17,22,.74);
            --surface-solid: #081116;

            --border: rgba(34,211,238,.18);

            --shadow:
                0 20px 70px rgba(0,0,0,.42);

            --grid:
                rgba(34,211,238,.055);

            --nav:
                rgba(3,6,9,.78);
        }

        /* =====================================================
           BACKGROUND
           ===================================================== */

        .background {
            position: fixed;
            inset: 0;
            z-index: -10;
            pointer-events: none;
            overflow: hidden;
        }

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    var(--grid) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    var(--grid) 1px,
                    transparent 1px
                );

            background-size:
                60px 60px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 85%
                );
        }

        .orb {
            position: absolute;
            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(90px);

            opacity: .13;
        }

        .orb.one {
            top: -150px;
            left: -100px;
            background: var(--primary);
        }

        .orb.two {
            top: 30%;
            right: -180px;
            background: #06b6d4;
        }

        .orb.three {
            bottom: -220px;
            left: 35%;
            background: #0284c7;
        }

        /* =====================================================
           CONTAINER
           ===================================================== */

        .container {
            width: min(1180px, calc(100% - 40px));
            margin: auto;
        }

        section {
            padding: 100px 0;
            scroll-margin-top: 90px;
        }

        /* =====================================================
           NAVBAR
           ===================================================== */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;

            background: var(--nav);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-bottom:
                1px solid var(--border);
        }

        .nav-inner {
            height: 74px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;

            font-size: 21px;
            font-weight: 800;

            white-space: nowrap;
        }

        .logo span {
            color: var(--primary);
        }

        .logo-mark {
            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            color: white;

            box-shadow:
                0 10px 30px
                rgba(14,165,233,.28);

            font-size: 14px;
            font-weight: 900;
        }

        .logo-mark img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .nav-links a {
            position: relative;

            padding: 9px 13px;

            color: var(--muted);

            font-size: 14px;
            font-weight: 600;

            border-radius: 10px;

            transition:
                color .2s ease,
                background .2s ease;
        }

        .nav-links a:hover {
            color: var(--primary);
            background: rgba(14,165,233,.07);
        }

        .nav-links a.active {
            color: var(--primary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border:
                1px solid var(--border);

            border-radius: 11px;

            color: var(--text);
            background: var(--surface);

            cursor: pointer;

            transition:
                transform .2s ease,
                border-color .2s ease,
                color .2s ease;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            color: var(--primary);
            border-color: var(--primary);
        }

        .menu-btn {
            display: none;
            font-size: 20px;
        }

        /* =====================================================
           HERO
           ===================================================== */

        .hero {
            min-height: 100vh;

            display: flex;
            align-items: center;

            padding-top: 130px;
        }

        .hero-content {
            display: grid;
            grid-template-columns:
                1.05fr .95fr;

            align-items: center;
            gap: 80px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            padding: 8px 13px;

            border:
                1px solid var(--border);

            border-radius: 999px;

            color: var(--muted);

            background:
                rgba(14,165,233,.055);

            font-size: 13px;
            font-weight: 600;

            margin-bottom: 25px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 5px
                rgba(34,197,94,.1);
        }

        .hero h1 {
            max-width: 760px;

            font-size:
                clamp(40px, 5.5vw, 76px);

            line-height: 1.1;

            letter-spacing: -1px;

            font-weight: 900;

            margin-bottom: 28px;
        }

        .gradient-text {
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    #06b6d4
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .hero-description {
            max-width: 650px;

            color: var(--muted);

            font-size: 18px;
            line-height: 1.8;

            margin-bottom: 34px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            min-height: 48px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 0 20px;

            border-radius: 13px;

            font-size: 14px;
            font-weight: 800;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                border-color .2s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }

        .btn-primary {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            box-shadow:
                0 12px 35px
                rgba(14,165,233,.25);
        }

        .btn-secondary {
            border:
                1px solid var(--border);

            color: var(--text);
            background: var(--surface);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* =====================================================
           PROFILE CARD
           ===================================================== */

        .hero-visual {
            display: flex;
            justify-content: center;
        }

        .profile-card {
            position: relative;

            width: min(440px, 100%);

            padding: 28px;

            border:
                1px solid var(--border);

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    var(--surface),
                    rgba(14,165,233,.035)
                );

            box-shadow: var(--shadow);

            overflow: hidden;
        }

        .profile-card::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            right: -100px;
            top: -100px;

            border-radius: 50%;

            background: var(--primary);

            opacity: .1;

            filter: blur(20px);
        }

        .profile-code {
            padding: 22px;

            border:
                1px solid var(--border);

            border-radius: 18px;

            background:
                rgba(2,132,199,.04);

            color: var(--muted);

            font-family:
                "Courier New",
                monospace;

            font-size: 13px;

            line-height: 1.9;

            direction: ltr;
            text-align: left;
        }

        .blue {
            color: var(--primary);
        }

        .profile-avatar {
            width: 110px;
            height: 110px;

            display: grid;
            place-items: center;

            margin: 30px auto 24px;

            border-radius: 50%;

            color: white;

            font-size: 30px;
            font-weight: 900;

            box-shadow:
                0 20px 50px
                rgba(14,165,233,.28);
        }

        .profile-avatar img {
            width: 76px;
            height: 76px;
            object-fit: contain;
        }

        .profile-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            padding-top: 20px;

            border-top:
                1px solid var(--border);
        }

        .profile-bottom strong {
            display: block;
            margin-bottom: 4px;
        }

        .profile-bottom small {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        /* =====================================================
           STATS
           ===================================================== */

        .stats {
            padding: 20px 0 80px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            border:
                1px solid var(--border);

            border-radius: 22px;

            background: var(--surface);

            overflow: hidden;
        }

        .stat {
            padding: 30px;

            text-align: center;

            border-left:
                1px solid var(--border);
        }

        .stat:last-child {
            border-left: 0;
        }

        .stat-number {
            color: var(--primary);

            font-size: 32px;
            font-weight: 900;

            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--muted);

            font-size: 13px;
            font-weight: 600;
        }

        /* =====================================================
           SECTION HEADINGS
           ===================================================== */

        .section-heading {
            max-width: 720px;
            margin-bottom: 48px;
        }

        .eyebrow {
            display: inline-block;

            color: var(--primary);

            font-size: 12px;
            font-weight: 900;

            letter-spacing: 1.8px;
            text-transform: uppercase;

            margin-bottom: 12px;
        }

        .section-heading h2 {
            font-size:
                clamp(30px, 4vw, 50px);

            letter-spacing: -1px;

            line-height: 1.15;

            margin-bottom: 16px;
        }

        .section-heading p {
            color: var(--muted);

            line-height: 1.8;
        }

        /* =====================================================
           CARDS
           ===================================================== */

        .card {
            border:
                1px solid var(--border);

            border-radius: var(--radius);

            background: var(--surface);

            box-shadow: var(--shadow);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        /* =====================================================
           ABOUT
           ===================================================== */

        .about-grid {
            display: grid;

            grid-template-columns:
                .9fr 1.1fr;

            gap: 24px;
        }

        .about-card {
            padding: 30
